backend:
  name: github
  repo: Korean0gson/0kbanana
  branch: main
  auth_type: pkce
  app_id: Ov23liV2A2kxxZLijpBC

publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "Homepage"
    description: "Edit the content of your main page"
    files:
      - label: "Main Page Content"
        name: "main"
        file: "src/content/homepage.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string", hint: "Shows in the browser tab and page header" }
          - { label: "Description", name: "description", widget: "text", hint: "Short text shown under the title" }
          - { label: "Body Content", name: "body", widget: "markdown", hint: "The main text on your page. You can add headings, links, images, etc." }
          - label: "Affiliate Links"
            name: "links"
            widget: "list"
            hint: "Add or remove links that appear on your page"
            fields:
              - { label: "Link Text", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
